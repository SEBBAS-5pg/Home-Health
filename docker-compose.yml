# Orquestación de los 3 servicios de Home-Health.
# Una sola red interna: los servicios se hablan por nombre (db, api, web).
# El navegador del usuario sale por los puertos publicados (3000 y 4000).

services:
  db:
    image: postgres:16-alpine
    container_name: hh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hh_pass}
      POSTGRES_DB: ${DB_NAME:-home_health}
    ports:
      - "5432:5432"
    volumes:
      - hh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hh_user} -d ${DB_NAME:-home_health}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hh_net

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    container_name: hh-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000

      DATABASE_URL: postgresql://${DB_USER:-hh_user}:${DB_PASSWORD:-hh_pass}@db:5432/${DB_NAME:-home_health}?schema=public

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-prod}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod}
      JWT_REFRESH_EXPIRES_IN: 7d

      BCRYPT_ROUNDS: 12

      # IMPORTANTE: API debe aceptar frontend público
      CORS_ORIGIN: http://44.212.12.107:3000

      SEED_ADMIN_EMAIL: admin@home-health.app
      SEED_ADMIN_PASSWORD: Admin12345!
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    networks:
      - hh_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ESTE ES EL CAMBIO CRÍTICO
        NEXT_PUBLIC_API_URL: http://44.212.12.107:4000/api
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: hh-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    networks:
      - hh_net

volumes:
  hh_pgdata:

networks:
  hh_net:
    driver: bridge